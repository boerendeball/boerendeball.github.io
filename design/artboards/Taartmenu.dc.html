<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Taartmenu – deurtje aangetikt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',sans-serif;color:#1E3A4C}
a{color:#1E3A4C;text-decoration:none}a:hover{color:#0E7FB5}
.kop{font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.1}
.ic{display:block}
.taart-optie{position:absolute;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;background:#FFFFFF;color:#0E6A98;font-weight:800;font-size:16px;box-shadow:0 4px 0 0 #CDE4F0,0 8px 16px rgba(30,58,76,0.22);white-space:nowrap;border:0;font-family:inherit;cursor:pointer}
.spaak{position:absolute;height:3px;background:#FFFFFF;opacity:0.7;transform-origin:0 50%;border-radius:2px}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; position: relative; overflow: hidden; background: #BFE6FA;">

  <!-- De kalender eronder -->
  <div style="position: absolute; inset: 0;">
    <dc-import name="Main" dagen="{{dagen}}" hint-size="390px,1180px"></dc-import>
  </div>

  <!-- Lichte dimlaag -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(30, 58, 76, 0.38);"></div>

  <!-- Aangetikt deurtje blijft oplichten -->
  <div aria-hidden="true" style="position: absolute; left: 209px; top: 718px; width: 165px; height: 124px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 0 0 5px #1FA3DC, 0 0 0 10px rgba(255,255,255,0.45), 0 12px 24px rgba(14,127,181,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #0E7FB5;">27 NOV</span>
    <span style="width: 58px; height: 58px; border-radius: 50%; background: #DDF1FB; display: flex; align-items: center; justify-content: center;">
      <svg class="ic" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><rect x="16" y="9" width="14" height="7" rx="2" fill="#1E3A4C"/><rect x="6" y="14" width="36" height="26" rx="5" fill="#1E3A4C"/><circle cx="24" cy="27" r="9" fill="#5BC0EB"/><circle cx="24" cy="27" r="5" fill="#0E7FB5"/><circle cx="21" cy="24" r="1.8" fill="#FFFFFF"/><rect x="34" y="18" width="5" height="3" rx="1" fill="#FFC93C"/></svg>
    </span>
    <span style="font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #1FA3DC; color: #FFFFFF;">Vandaag!</span>
  </div>

  <!-- Taartmenu -->
  <div role="menu" aria-label="Acties voor deurtje 27 november" style="position: absolute; left: 0; top: 0; width: 390px; height: 1180px;">

    <!-- Spaken van het middelpunt naar de opties -->
    <div class="spaak" aria-hidden="true" style="left: 195px; top: 668px; width: 92px; transform: rotate(-90deg);"></div>
    <div class="spaak" aria-hidden="true" style="left: 195px; top: 668px; width: 92px; transform: rotate(0deg);"></div>
    <div class="spaak" aria-hidden="true" style="left: 195px; top: 668px; width: 92px; transform: rotate(90deg);"></div>
    <div class="spaak" aria-hidden="true" style="left: 195px; top: 668px; width: 92px; transform: rotate(180deg);"></div>

    <!-- Middelpunt: wie voert de actie uit -->
    <div style="position: absolute; left: 151px; top: 624px; width: 88px; height: 88px; border-radius: 50%; background: #FFD6E6; border: 5px solid #FFFFFF; box-shadow: 0 0 0 3px #1FA3DC, 0 10px 22px rgba(30,58,76,0.35); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <span class="kop" style="font-size: 30px; color: #B23A6A; line-height: 1;">P</span>
      <span style="font-size: 10px; font-weight: 800; color: #B23A6A; letter-spacing: 0.5px;">PINO</span>
    </div>

    <!-- Boven: hoofdactie -->
    <a href="Open.dc.html" role="menuitem" class="taart-optie" style="left: 124px; top: 540px; background: #39D353; color: #0E3D1C; box-shadow: 0 4px 0 0 #1FA34A, 0 8px 16px rgba(30,58,76,0.22);">
      <svg class="ic" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><rect x="8" y="6" width="32" height="36" rx="5" fill="#0E3D1C"/><rect x="14" y="12" width="20" height="24" rx="3" fill="#39D353"/><circle cx="29" cy="24" r="2.5" fill="#0E3D1C"/></svg>
      Open deurtje
    </a>

    <!-- Rechts -->
    <a href="Vergrendeld.dc.html" role="menuitem" class="taart-optie" style="left: 262px; top: 645px;">
      <svg class="ic" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M4 24 q20 -22 40 0 q-20 22 -40 0z" fill="none" stroke="#0E6A98" stroke-width="4"/><circle cx="24" cy="24" r="6" fill="#0E6A98"/></svg>
      Gluren…
    </a>

    <!-- Onder -->
    <a href="Open.dc.html" role="menuitem" class="taart-optie" style="left: 128px; top: 752px;">
      <svg class="ic" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M24 42 C10 32 4 24 4 16 a10 10 0 0 1 20 -4 a10 10 0 0 1 20 4 c0 8 -6 16 -20 26z" fill="#FF6FAE"/></svg>
      Briefje lezen
    </a>

    <!-- Links -->
    <a href="Main.dc.html" role="menuitem" class="taart-optie" style="left: 8px; top: 645px; color: #4F6B7E;">
      <svg class="ic" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path d="M12 12 L36 36 M36 12 L12 36" stroke="#4F6B7E" stroke-width="5" stroke-linecap="round"/></svg>
      Annuleren
    </a>
  </div>

  <!-- Uitleg-bubbel zoals een Sims-hint -->
  <div style="position: absolute; left: 24px; right: 24px; top: 440px; background: #FFFFFF; border-radius: 18px; padding: 12px 16px; box-shadow: 0 6px 18px rgba(30,58,76,0.25); font-size: 14px; line-height: 1.35; text-align: center;">
    <strong>Tik op een deurtje</strong> en kies wat Pino gaat doen. Gluren mag, maar de gans houdt de wacht.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dagen":{"editor":"int","default":7,"min":0,"max":10,"section":"Aftellen"},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { dagen: this.props.dagen ?? 7 };
  }
}
</script>
</body>
</html>

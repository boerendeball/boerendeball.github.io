<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boerendeball</title>
  <meta name="description" content="De website van Boerendeball.">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1f2421;
      --muted: #5c645f;
      --accent: #2f7d4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161a17;
        --text: #e8ece9;
        --muted: #a3aca6;
        --accent: #6cc48f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 40rem; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Boerendeball</h1>
    <p>Welkom! Deze website is in aanbouw.</p>
  </main>
</body>
</html>

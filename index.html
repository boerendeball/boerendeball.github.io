<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boerendeball</title>
  <meta name="description" content="De website van Boerendeball.">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1f2421;
      --muted: #5c645f;
      --accent: #2f7d4f;
      --card: #ffffff;
      --card-shadow: #e3e8e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161a17;
        --text: #e8ece9;
        --muted: #a3aca6;
        --accent: #6cc48f;
        --card: #1f2421;
        --card-shadow: #0f1210;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 40rem; text-align: center; display: grid; gap: 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0; }
    a { color: var(--accent); }
    .kaart {
      display: block;
      padding: 1.25rem 1.5rem;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 6px 0 0 var(--card-shadow);
      text-decoration: none;
      color: inherit;
    }
    .kaart strong { display: block; font-size: 1.15rem; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Boerendeball</h1>
      <p>Welkom! Deze website is in aanbouw.</p>
    </div>
    <a class="kaart" href="/advent/">
      <strong>Pino's verjaardagskalender</strong>
      <span>Tien deurtjes tot 3 december.</span>
    </a>
  </main>
</body>
</html>
